    }
    dialog.showModal();
  }
  function showNotice(message){const notice=document.getElementById('notice');notice.textContent=message;notice.hidden=false;clearTimeout(noticeTimeout);noticeTimeout=setTimeout(()=>{notice.hidden=true;},4200);}
  function downloadFile(content,type,filename){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function downloadResult(){
    const lines=['PEGASUS EN DEBATE','Actividad de socialización · Informática y Sociedad',`Resultado: ${score()} de ${questions.length} respuestas correctas.`,''];
    questions.forEach((question,index)=>{const answer=state.answers[index];lines.push(`${index+1}. ${question.question}`,`Respuesta elegida: ${question.options[answer]}`,`Respuesta correcta: ${question.options[question.correct]}`,`Explicación: ${question.feedback[question.correct]}`,`Fuente: diapositiva ${question.slide}. ${question.source}`,'');});
    lines.push('REFLEXIÓN FINAL (SIN CALIFICACIÓN)','¿Qué límites debe tener el poder de vigilancia del Estado?',state.reflection.trim()||'Sin respuesta escrita.','', 'Fuente de la actividad: Tecnologías para vigilar por parte del gobierno, de Isaac Ignacio Artavia Salazar.','Presentación: https://canva.link/ua9pjuk310277x9');
    downloadFile(lines.join('\n'),'text/plain;charset=utf-8','resultado-pegasus.txt');showNotice('Su resultado está listo para descargar.');
  }
  document.addEventListener('change',event=>{
    if(event.target.matches('input[name="answer"]')&&!state.revealed){state.selected=Number(event.target.value);app.querySelectorAll('.answer-option').forEach((label,index)=>label.classList.toggle('selected',index===state.selected));document.getElementById('answerButton').disabled=false;}
  });
  document.addEventListener('input',event=>{if(event.target.id==='reflection')state.reflection=event.target.value;});
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(action==='start'||action==='retry')startActivity();
    else if(action==='check')checkAnswer();
    else if(action==='next')nextQuestion();
    else if(action==='hint'){state.hint=!state.hint;const hint=document.getElementById('hintText');hint.hidden=!state.hint;button.setAttribute('aria-expanded',String(state.hint));button.textContent=state.hint?'Ocultar pista':'¿Necesita una pista?';}
    else if(action==='sources'||action==='instructions')showDialog(action);
    else if(action==='close-dialog')dialog.close();
    else if(action==='download-html'){downloadFile(originalDocument,'text/html;charset=utf-8','actividad-pegasus.html');showNotice('Abra el archivo descargado en cualquier navegador para usarlo sin conexión.');}
    else if(action==='download-result')downloadResult();
  });
  dialog.addEventListener('click',event=>{if(event.target===dialog){const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)dialog.close();}});
  renderIntro();
  </script>
</body>
</html>
